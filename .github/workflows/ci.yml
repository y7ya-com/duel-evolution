# The same guard as the pre-commit hook (infra/guard.py) on every commit a push or PR brings, then the server checks.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Guard the new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            python3 infra/guard.py --range "$AFTER"     # new branch or force push: every commit reachable from it
          else
            python3 infra/guard.py --range "$BEFORE..$AFTER"
          fi
      - name: Whole tree
        run: python3 infra/guard.py --all
      - name: Python parses
        run: python3 -c "import ast,pathlib,sys; [ast.parse(p.read_bytes(),str(p)) for p in pathlib.Path('.').rglob('*.py')]"

  server:
    # typecheck and tests need server/gamedata/ (Konami-derived, not in the repo): only where the site's Cloudflare
    # token is available (this repo's own pushes and PRs, never forks), via infra/fetch-private.sh
    runs-on: ubuntu-latest
    needs: guard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: 'echo "::notice::server checks skipped (no CLOUDFLARE_API_TOKEN secret to fetch server/gamedata)"'
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install, fetch gamedata, typecheck, test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          cd server && pnpm install --frozen-lockfile
          ../infra/fetch-private.sh
          pnpm typecheck
          pnpm test
