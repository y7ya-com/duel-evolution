<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yo2rc</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #log { position: fixed; left: 0; right: 0; bottom: 0; max-height: 30vh; overflow: auto; margin: 0; padding: 4px 8px;
         white-space: pre-wrap; background: rgba(0, 0, 0, .7); pointer-events: none; }   /* clicks reach the game */
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<pre id="log"></pre>
<script>
  // Needs a cross-origin-isolated page (COOP same-origin + COEP require-corp) for SharedArrayBuffer. With JSPI it runs
  // yo2rc.js, without (Safari, Firefox) the ASYNCIFY build yo2rc-async.js (the Makefile swaps the script tag for that choice).
  const logEl = document.getElementById("log");
  const showLog = new URLSearchParams(location.search).has("log");   // ?log shows the runtime log
  if (!showLog) logEl.style.display = "none";
  const tail = [];   // the last 200 lines, for crash reports
  const log = (s) => {
    tail.push(s); if (tail.length > 200) tail.shift();
    if (showLog) { logEl.textContent += s + "\n"; logEl.scrollTop = logEl.scrollHeight; }
    console.log(s);
    if (/^(rc_trap at|MISSING IMPORT|guest fault|host fault)/.test(s)) crash(s);
  };
  // A guest trap (it logs, then exits), an abort or an exit: report it once to /__crash, then tell the player instead of
  // leaving a frozen canvas. A "yo2crash" listener (the loader) may draw its own message.
  let crashed = false;
  const report = (why, fatal) => fetch("/__crash", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ why: String(why).slice(0, 2000), fatal, log: tail.join("\n").slice(-59000),
      build: document.querySelector('meta[name="yo2-build"]')?.content || "", ua: navigator.userAgent,
      frames: Module.yo2Presents | 0, url: location.pathname,
      lazy: Module.yo2Lazy?.stats }) }).catch(() => {});   // lazyfs counters: syncFail/syncRetry/storeBad tell a bad read from bad data
  // A page loaded during a ship can pair one build's JS with the other's wasm (the files are replaced one by one): that
  // fails before the first frame with a link error. Reload once (reported as nonfatal) instead of the crash screen.
  const SKEW = /ASM_CONSTS|LinkError|Import #\d|import .* is not a function/;
  function crash(why) {
    if (crashed) return;
    crashed = true;
    let again = false;
    // at most once a minute, so a real link error still ends in the crash report
    try { again = !(Module.yo2Presents | 0) && SKEW.test(why) && Date.now() - (+sessionStorage.getItem("yo2-skew") || 0) > 60000 &&
      (sessionStorage.setItem("yo2-skew", String(Date.now())), true); } catch (e) {}
    if (again) { report(why, false); setTimeout(() => location.reload(), 1000); return; }
    console.log("yo2rc crash: " + String(why).slice(0, 2000));
    setTimeout(() => {   // let the guest stack lines that follow the trap line arrive
      report(why, true);
      if (!dispatchEvent(new CustomEvent("yo2crash", { detail: why, cancelable: true }))) return;
      const d = document.createElement("div");
      d.style.cssText = "position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;" +
        "justify-content:center;gap:16px;background:rgba(0,0,0,.85);color:#fff;font:18px sans-serif;z-index:10";
      d.innerHTML = '<div>Something went wrong.</div><button style="font:16px sans-serif;padding:8px 20px">Reload</button>';
      d.querySelector("button").onclick = () => location.reload();
      document.body.append(d);
    }, 500);
  }
  // An uncaught JS error or rejection is the crash only if the game stops with it: one from a page callback (audio, the
  // loader, an extension) leaves the guest running. Once the game draws, it waits for the next Present: one comes ->
  // reported as nonfatal (3 per page), the game goes on; 20 checks 250 ms apart with none -> crash. A check only runs
  // when the main thread is free and the page visible, so a long synchronous read or a hidden tab is not mistaken for a
  // dead game. Before the first frame (a failed download, a boot error) it is the crash at once.
  let nonfatal = 0;
  function failed(why) {
    if (crashed) return;
    const at = Module.yo2Presents | 0;
    if (!at) return crash(why);
    let checks = 20;
    const check = () => {
      if (crashed) return;
      if ((Module.yo2Presents | 0) > at) { console.log("yo2rc nonfatal: " + why); if (nonfatal++ < 3) report(why, false); return; }
      if (!document.hidden && --checks <= 0) return crash(why);
      setTimeout(check, 250);
    };
    setTimeout(check, 250);
  }
  addEventListener("error", (e) => failed("error: " + (e.message || e)));
  // Firefox's and Safari's .stack leave the message out
  addEventListener("unhandledrejection", (e) => failed("unhandled rejection: " + (e.reason?.message ? e.reason + "\n" : "") + (e.reason?.stack || e.reason)));
  if (!crossOriginIsolated) log("not cross-origin isolated: serve with COOP/COEP headers (web/serve.mjs does)");
  if (!("Suspending" in WebAssembly)) log("no JSPI (WebAssembly.Suspending): the ASYNCIFY build");
  var Module = { canvas: document.getElementById("canvas"), print: log, printErr: log,
                 onAbort: (w) => crash("abort: " + w), onExit: (code) => code && crash("exit " + code) };
</script>
<script id="pick">
  // Which build (the Makefile drops Emscripten's own script tag; infra/ship-client.sh puts the stage and loader
  // scripts just before this one): iOS/iPadOS (or ?ios) the 1 GB ASYNCIFY build (make web-ios), else JSPI if the
  // browser has it (and the page has no ?async), else ASYNCIFY (make web-async).
  // Firefox always gets ASYNCIFY: its JSPI (on by default from 158) breaks the synchronous Range XHRs from a suspended
  // stack and its WebGL refuses views of the JSPI build's 2 GB heap.
  // Each build creates its whole shared memory at boot. Phones (32-bit Chrome) often can't reserve the JSPI build's 2 GB
  // ("WebAssembly.Memory(): could not allocate memory"), so V8 tries that size first and falls back to the 1 GB build
  // (ASYNCIFY runs in Chrome too). The trial memory is garbage at once: V8 collects it if the real one needs the room.
  // Not tried on WebKit, which commits all of it. Firefox (Windows commits a shared memory whole) can get the 2 GB
  // ASYNCIFY memory and then run out compiling the wasm ("InternalError: out of memory", field 2026-10-29): a 2 GB
  // build that runs out before its first frame marks the device (localStorage yo2-small) and reloads once into the
  // 1 GB build. A memory the 1 GB build itself can't get ends in a message, not a crash.
  {
    const q = new URLSearchParams(location.search);
    const ios = q.has("ios") || /iPhone|iPad|iPod/.test(navigator.userAgent) || navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    let small = false;
    try { small = localStorage.getItem("yo2-small") === "1"; } catch (e) {}
    const s = document.createElement("script");
    s.async = true;
    s.src = ios || small ? "yo2rc-ios.js" : "Suspending" in WebAssembly && !navigator.userAgent.includes("Firefox/") && !q.has("async") ? "yo2rc.js" : "yo2rc-async.js";
    if (s.src.endsWith("/yo2rc.js")) try { new WebAssembly.Memory({ initial: 32768, maximum: 32768, shared: true }); }
      catch (e) { log("no room for a 2 GB memory (" + e.message + "): the 1 GB build"); s.src = "yo2rc-ios.js"; }
    // start the wasm download now, beside the runtime script, not once that script has run (Emscripten's own
    // fetch(…, { credentials: "same-origin" }) then takes this response: crossorigin "anonymous" is the same mode)
    const pre = document.createElement("link");
    pre.rel = "preload"; pre.as = "fetch"; pre.crossOrigin = "anonymous"; pre.href = s.src.replace(/\.js$/, ".wasm");
    document.head.append(pre);
    addEventListener("yo2crash", (e) => {
      // the streaming compile running out leaves the ArrayBuffer retry with a broken body ("failed to match magic number")
      if (!/could not allocate memory|out of memory|failed to match magic number/i.test(e.detail)) return;
      e.preventDefault();
      if (!/yo2rc-ios[-.]/.test(s.src) && !(Module.yo2Presents | 0)) {
        try { localStorage.setItem("yo2-small", "1"); log("out of memory before the first frame: the 1 GB build from now on"); location.reload(); return; }
        catch (err) {}   // no storage: the message below
      }
      const d = document.createElement("div");
      d.style.cssText = "position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;" +
        "gap:16px;padding:0 16px;text-align:center;background:#000;color:#fff;font:18px sans-serif;z-index:10";
      d.innerHTML = "<div>This device doesn't have enough free memory for the game.<br>Close other apps and tabs, then try again.</div>" +
        '<button style="font:16px sans-serif;padding:8px 20px">Reload</button>';
      d.querySelector("button").onclick = () => location.reload();
      document.body.append(d);
    });
    document.body.append(s);
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
