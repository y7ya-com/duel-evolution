<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>htmlui mock</title>
<style>
  html, body { margin: 0; background: #234; }
  #htmlui-host { position: relative !important; }
</style>
</head>
<body>
<script type="module">
// A mock snapshot (mock/<s>.json) through the same layer the game uses: ?s=playerselect (default), ?mode=owned to
// hand screen modules owned mode, ?svelte=deck for a group's Svelte build (gen/). Every window is owned here. Clicks in owned mode log to the console.
import { makeLayer, loadScreens, switches } from './bridge.js';
const q = new URLSearchParams(location.search);
const snap = await (await fetch(`mock/${q.get('s') || 'playerselect'}.json`)).json();
const host = document.createElement('div');
host.id = 'htmlui-host';
document.body.append(host);
const { render } = await makeLayer(host, await loadScreens(undefined, switches(q.get('svelte'))), q.get('art') || '../ui/');
const log = name => (...a) => console.log('api.' + name, ...a);
const api = Object.fromEntries(['click', 'hover', 'key', 'char', 'setText', 'setValue', 'scroll', 'wheel'].map(n => [n, log(n)]));
render(snap, new Set(snap.windows.map(w => w.id)), api);
// a test feeds more snapshots after it (svelte/deck_dom_test.mjs)
window.__render = s => render(s, new Set([...s.windows, ...s.tasks || []].map(w => w.id)), api);
window.__ready = true;
</script>
</body>
</html>
