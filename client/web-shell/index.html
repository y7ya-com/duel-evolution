<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel Evolution</title>
<meta name="description" content="Duel Evolution: the online card-dueling game, in your browser.">
<style>html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 15px system-ui, sans-serif; }
  p { position: fixed; inset: 0; margin: auto; height: 6em; max-width: 40em; padding: 0 16px; text-align: center; }</style>
<p id="msg" hidden></p>
<script>
  // The site root: the game client (yo2rc.html, the recompiled exe). Same-origin updater HTTP (/yo2/, /app/ -> the game server),
  // the network gateway at /net, game ports with the server's +1000 offset, DejaVu Sans for GDI text. Extra query
  // params (e.g. ?RC_VERBOSE=1, ?log) pass through.
  // Chrome/Edge run the JSPI build, Safari/Firefox the ASYNCIFY one, iPhone/iPad its 1 GB variant (yo2rc.html picks).
  // Phones and tablets are welcome: stage.js does touch, the on-screen keyboard and the layout. Only these are truly missing:
  const gl2 = (() => { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
  const block = !window.crossOriginIsolated || typeof SharedArrayBuffer === "undefined" ? "shared-memory" : !gl2 ? "webgl2" : "";
  const why = {
    "shared-memory": "This browser is too old for the game, or it is an app's built-in browser. Update it, or open this page in Firefox or a current Chrome, Edge or Safari.",
    webgl2: "This browser can't draw the game (no WebGL 2): the graphics card or its driver may be too old, or hardware acceleration is off. Turn hardware acceleration on, update the graphics driver, or try Firefox.",
  }[block];
  if (block) {
    const m = document.getElementById("msg");
    m.textContent = why;
    m.hidden = false;
    // a blocked browser never reaches the game's crash reporter: one row per load (the reason and the browser, nothing personal)
    fetch("/__crash", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ why: "blocked: " + block, fatal: true, ua: navigator.userAgent, url: location.pathname, coi: !!window.crossOriginIsolated,
        sab: typeof SharedArrayBuffer !== "undefined", gl2 }) }).catch(() => {});
  } else {
    fetch("__warm", { keepalive: true }).catch(() => {});   // wake the game server while the client boots (survives the redirect)
    const q = new URLSearchParams(location.search);
    const set = (k, v) => q.has(k) || q.set(k, v);
    // The game's server, gateway and data folders are always this site's: a link's ?game=… pointed lazyfs at a folder
    // that isn't there (crash reports 9ea57629, d5dc4982: "no manifest at yiaKk/files.txt"), and a ?gateway=/?http= from
    // a link would send the game's connection (and the login it asks for) to someone else's server. Local runs open
    // yo2rc.html directly with their own values.
    q.set("http", location.origin);
    q.set("gateway", (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/net");
    q.delete("game"); q.delete("cards"); q.set("fonts", "fonts/");
    q.set("server", "127.0.0.1");
    set("YO2_PORT_OFFSET", "1000");
    location.replace("yo2rc.html?" + q);
  }
</script>
